query RackOverview($page: Int = 0, $size: Int = 20, $nameLike: String) {
  racks(page: $page, size: $size,
        filter: { name: { like: $nameLike } },
        orderBy: { name: ASC }) {
    id
    name
    serialNumber
    heightUnits
    children(orderBy: { name: ASC }) {
      id
      type
      name
      serialNumber
    }
    administrators(orderBy: { primaryAdministrator: DESC }) {
      primaryAdministrator
      person { id name personType contact { email phone endpoint } }
    }
  }
}
