// The reusable framework. A plain library: no Spring Boot plugin, no main class.
// With Spring Boot on the classpath, its auto-configuration (package boot) registers the runtime beans and the
// GraphQL base schema of all generated models on the classpath.
plugins {
    id 'java-library'
}

description = 'Data stack runtime: DAO base class, business rule dispatcher, REST error handling'

dependencies {
    // Versions come from the Spring Boot BOM; "api" so modules using the runtime get the same versions.
    api platform(libs.spring.boot.bom)

    // Part of the runtime's public API: entities and DAOs need JPA, rules are Spring beans.
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework:spring-context'

    implementation 'org.springframework:spring-aop'
    implementation 'org.springframework:spring-orm'
    implementation 'org.springframework:spring-web'
    implementation 'org.slf4j:slf4j-api'

    // Spring Boot integration (com.aixpertsoft.datastack.boot): only active when the application uses Spring Boot,
    // so the runtime itself stays a plain library. Applications bring these through their starters.
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework.boot:spring-boot-graphql'
    compileOnly 'org.springframework.graphql:spring-graphql'
    compileOnly 'org.springframework:spring-webmvc'
}
