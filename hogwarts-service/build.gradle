// The Hogwarts microservice, generated from model/model.json.
//
//   model/model.json          source of truth for tables, entities, relations and views
//   build/generated/datastack generated code and resources: rewritten on every build, never edited
//   src/main/java, resources  code you own: subclasses created once by the generator, rules, custom logic
//
// ./gradlew :hogwarts-service:generateCode   regenerates (also runs automatically before compileJava)
plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

description = 'Hogwarts microservice generated from model.json'

configurations {
    datastackGenerator
}

dependencies {
    datastackGenerator project(':datastack-generator')

    implementation project(':datastack-runtime')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

def generatedJava = layout.buildDirectory.dir('generated/datastack/java')
def generatedResources = layout.buildDirectory.dir('generated/datastack/resources')

def generateCode = tasks.register('generateCode', JavaExec) {
    group = 'datastack'
    description = 'Generates entities, DAOs, services, REST, views and the Liquibase changelog from model/model.json'
    classpath = configurations.datastackGenerator
    mainClass = 'com.aixpertsoft.datastack.generator.Main'

    inputs.dir('model')
    outputs.dir(generatedJava)
    outputs.dir(generatedResources)

    args 'generate',
         '--model', file('model/model.json').absolutePath,
         '--generated-java', generatedJava.get().asFile.absolutePath,
         '--generated-resources', generatedResources.get().asFile.absolutePath,
         '--owned-java', file('src/main/java').absolutePath,
         '--owned-resources', file('src/main/resources').absolutePath
}

sourceSets {
    main {
        java.srcDir(generateCode.map { generatedJava })
        resources.srcDir(generateCode.map { generatedResources })
    }
}

// ---- deploy into datastack-server ----
// The plain jar (tasks.jar) is the model as a plug-in: generated + custom classes, no Spring Boot loader.
// Its application.yaml is left out, so the server's configuration wins.
tasks.named('jar') {
    exclude 'application.yaml'
}

def deployments = rootProject.layout.projectDirectory.dir('datastack-server/deployments')

tasks.register('deploy', Copy) {
    group = 'datastack'
    description = 'Copies this model into datastack-server/deployments; restart the server to load it'
    from tasks.named('jar')
    into deployments
    rename { 'hogwarts.jar' }
    doLast { logger.lifecycle("Deployed hogwarts -> ${deployments.asFile}/hogwarts.jar (restart datastack-server)") }
}

tasks.register('undeploy', Delete) {
    group = 'datastack'
    description = 'Removes this model from datastack-server/deployments; restart the server to unload it'
    delete deployments.file('hogwarts.jar')
}
